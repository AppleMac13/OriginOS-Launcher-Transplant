%tag:start
%type:RenderNode&1&0
%name:globalLightEffect
%position:0.0&0.0&0.0
%rotation:0.0
%scale:1.0&1.0
%width:1080.0
%height:2400.0
%vert:
#version 320 es
layout (location = 0) in vec4 aPosition;
layout (location = 1) in vec2 aTexCoord;
uniform mat4 MVP;
out vec2 vTexCoord;
void main()
{
   gl_Position = MVP * aPosition;
   vTexCoord = vec2(aTexCoord.x, aTexCoord.y);
}
%frag:
#version 320 es
precision highp float;
in vec2 vTexCoord;
uniform float time;
uniform vec2 iResolution;
uniform sampler2D inputImageTexture;
uniform float speed;
uniform float breathingRate;
uniform float outAmplitude; //外部振幅参数
uniform float uBrightness; // 亮度调整因子
uniform vec3 positions[5]; // 颜色中心位置
uniform vec4 colors[5]; // 颜色数组
uniform vec4 backColor;
uniform float blurRadiusFactor; // 边缘光调整因子
uniform float showAlpha;
uniform vec2 startPoint;

uniform float cornerRadius;
uniform float uBlurRadius;

out vec4 fragColor;

const float PI = 3.1415926;
const int COLOR_NUM = 5;

float sdRoundRect(vec2 p, vec2 b, float r) {
    vec2 q = abs(p)-b+r;
    return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
}

float sigmoid(float t) {
    if(t > 0.0) return 0.5;
    return 0.5 / (1.0 - t);
}
float gauss(float dis, float sx){

    float arg = dis;
    arg = -(arg*arg)/(2.0*sx);

    float a = pow(1./(2.*3.1415*sx), 0.5);

    return a*exp(arg);
}
float smoothstep_gauss(float edge0, float edge1, float x) {
    float t = (x - edge0) / (edge1 - edge0);
    t = max(0.0, min(1.0, t));
    //return t * t * (3.0 - 2.0 * t);
    return 1.0 - (gauss(t, 1.0 /(2.0*PI)) - 1.0/exp(PI)) *(exp(PI)/(exp(PI) - 1.0));
}
vec4 computeAddColor(vec4 curColor[COLOR_NUM], int ballColorNum) {
    if (ballColorNum <= 0) {
        return vec4(0.0);
    } else {
        vec4 ballColor = vec4(0);
        for (int i=0; i<COLOR_NUM; i++) {
            float a = smoothstep_gauss(0.0, 1.0, curColor[i].a / (curColor[i].a + ballColor.a));
            ballColor = mix(ballColor, curColor[i], a);
        }
        return ballColor;
    }
}
vec4 computeBallColor(vec2 uv) {
    vec4 curColor[COLOR_NUM];
    int colorNum = 0;
    for (int i=0; i<COLOR_NUM; i++) {
        vec2 ballPos = vec2(positions[i].x, positions[i].y) * iResolution.xy;
        float dis = distance(uv, ballPos);
        if (dis <= positions[i].z * iResolution.x * 1.0) {
            float a = smoothstep_gauss(0.2, 1.0, dis / (positions[i].z * iResolution.x * 1.0));
            curColor[i] = mix(colors[i], vec4(0.0), a);
            colorNum += 1;
        }
    }
    return computeAddColor(curColor, colorNum);
}
vec2 getBezierValue(vec2 p1, vec2 p2, float t) {
   float s = (1.0 - t);
   return p1 * pow(s, 2.0) * t * 3.0 + p2 * pow(t, 2.0) * s * 3.0 + vec2(1.0, 1.0) * pow(t, 3.0);
}

// Forward only required for compositor in rec2020 mode
const mat3 RgbRec709xyzRec2020 = mat3(
0.627403895934699,  0.069097289358232,  0.016391438875150,
0.329283038377884,  0.919540395075459,  0.088013307877226,
0.043313065687417,  0.011362315566309,  0.895595253247624);

const mat3 p3tobt709 = mat3(
1.11982728000000, -0.0403418400000000, -0.0186765000000000,
-0.141059440000000, 1.03351064000000, -0.0819336400000000,
0.0213774000000000, 0.00691316000000000, 1.10063664000000);

const float gamma2020 = 1.2;
const float gamma709 = 2.2;
const float hlgRgbUpScale = 1.0;
const float hlgPeakLevel = 1.0;
const float hlgBlackLevel = 0.0001;
const float hlgGamma = 1.2;

const float hlgInvGamma       = 1.0 / hlgGamma;
const float hlgPowNegInvGamma = pow(hlgPeakLevel, -hlgInvGamma);
const float hlgBeta           = sqrt(3.0 * pow(hlgBlackLevel / hlgPeakLevel, hlgInvGamma));
const float hlgBetaFraction   = 1.0 / (1.0 - hlgBeta);
const float hlgInvGammaMinus1 = hlgInvGamma - 1.0;
// Matrix tools
vec3 ColorSpaceConversion(mat3 csc, vec3 pixel)
{
    pixel.rgb = csc * pixel.rgb;
    return pixel;
}

vec3 sRGB2L(vec3 pixel)
{
    for (int i = 0; i < 3; i++)
    {
        if(pixel[i] <= 0.040448236277108)
        pixel[i] /= 12.92;
        else
        pixel[i] = pow(((pixel[i] + 0.055) / 1.055), 2.2);
    }
    pixel *= vec3(1.0);
    return pixel;
}

    #define HLG_A (0.17883277)
    #define HLG_B (1.0 - (4.0 * HLG_A))
    #define HLG_C (0.5 - HLG_A * log(4.0 * HLG_A))
    #define HLG_EPSILON (0.0001) // Could be different between mediump and highp

vec3 HLGOETF(vec3 pixel)
{
    pixel = max(pixel, 0.0);
    for (int i = 0; i < 3; i++)
    {
        if(pixel[i] <= (1.0 / 12.0))
        pixel[i] = sqrt(pixel[i] * 3.0);
        else
        pixel[i] = HLG_A * log(max(HLG_EPSILON, 12.0 * pixel[i] - HLG_B)) + HLG_C;
    }
    return pixel;
}

vec3 L2HLG(vec3 pixel)
{
    float Ys = 0.0;
    float Yd = dot(pixel, vec3(0.2627, 0.6780, 0.0593));
    if (Yd > 0.0)
    Ys = pow(Yd, hlgInvGammaMinus1);
    vec3 Ls = pixel * vec3(Ys) * vec3(hlgPowNegInvGamma);
    return (HLGOETF(Ls) - hlgBeta) * hlgBetaFraction;
}

vec3 convert709To2020(vec3 pixel){
    vec3 result = sRGB2L(pixel);
    result = ColorSpaceConversion(RgbRec709xyzRec2020, result);
    result.rgb = L2HLG(result);

    return result;
}

vec4 culColor(vec2 uv){
    vec2 p[6];
    p[0] = positions[0].xy;
    p[1] = positions[1].xy;
    p[2] = positions[2].xy;
    p[3] = positions[3].xy;
    p[4] = positions[4].xy;
    p[5] = vec2(0.5);
    float weight[6];
    weight[0] = positions[0].z;
    weight[1] = positions[1].z;
    weight[2] = positions[2].z;
    weight[3] = positions[3].z;
    weight[4] = positions[4].z;
    weight[5] = 0.9;
    vec3 c[6];
    c[0] = (colors[0].rgb/255.0);
    c[1] = (colors[1].rgb/255.0);
    c[2] = (colors[2].rgb/255.0);
    c[3] = (colors[3].rgb/255.0);
    c[4] = (colors[4].rgb/255.0);
    c[5] = backColor.rgb/255.0;
    float blend = 3.0;
    vec3 sum = vec3(0.0);
    float valence = 0.0;
    for (int i = 0; i < 6; i++) {
        float distance = length(uv * iResolution - p[i] * iResolution);
        if(i == 5) distance = 600.0;
        float w = 0.0;
        if(weight[i] > 0.0)
            w =  1.0 / pow((distance + 202.0) / weight[i], blend);
        sum += w * c[i];
        valence += w;
    }
    sum /= valence;
    return vec4(sum, 1.0);
}
float getMask(vec2 uv){
   float realT = time;
   float radiusX = 0.0;
   float radiusY = 0.0;
   if (realT < 533.0){
      float t = realT /533.0;
      float offset = getBezierValue(vec2(0.33, 0.00), vec2(0.56, 0.44), t).y;
      radiusX = offset * 400.0 / 2.0;
      radiusY = offset * 544.0 / 2.0;
   } else if (realT < 533.0 + 933.0){
      float t = (realT - 533.0) / 933.0;
      float offset = getBezierValue(vec2(0.25, 0.10), vec2(0.25, 1.00), t).y;
      radiusX = (400.0 + offset * (4284.0 - 400.0))/ 2.0;
      radiusY = (544.0 + offset * (4284.0 -  544.0))/ 2.0;
   } else {
      radiusX = 4284.0 / 2.0;
      radiusY = 4284.0 / 2.0;
   }

   float normalizeRadiusX = radiusX + 0.1 /*/ 1260.0*iResolution.x*/;
   float normalizeRadiusY = radiusY + 0.1 /*/ 2800.0*iResolution.y*/;

   float base = min(normalizeRadiusX, normalizeRadiusY) / 2142.0;
   vec2 uv1 = uv - startPoint;
   float angle = atan(uv1.y, uv1.x);
   //float wave = base * (0.02 * sin(angle * 10.0) + 0.01 * cos(angle * 10.0)) * 2142.0;
   float t = realT /1000.0;
   float wave = base * (0.02 *clamp(t, 0.0, 2.0) * sin(angle * 5.0*clamp(t, 0.0, 2.0) + 1.9) + 0.02 * clamp(t, 0.0, 2.0) * cos(angle * 6.5*clamp(t * 2.0, 0.0, 2.0))) * 2142.425;

   float alpha = 1.0 - smoothstep(normalizeRadiusX - 20.0, normalizeRadiusX,
   length(iResolution.xy *(uv - startPoint) * vec2(normalizeRadiusY/normalizeRadiusX, 1.0)) + wave);

   float tempAlpha2 = 1.0 - smoothstep(normalizeRadiusX - 200.0, normalizeRadiusX,
   max(0.0, length(iResolution.xy *(uv - startPoint) * vec2(normalizeRadiusY/normalizeRadiusX, 1.0)) + wave - 200.0));

   return alpha * 0.3 + 0.2 * tempAlpha2;
}
float hash12(vec2 p)
{
    vec3 p3  = fract(vec3(p.xyx) * vec3(443.8975, 397.2973, 491.1871));
    p3 += dot(p3, p3.yzx + 19.19);
    return fract((p3.x + p3.y) * p3.z);
}
mat2 rotate2d(float angle){
    angle = radians(angle);
    float s = sin(angle);
    float c = cos(angle);
    return mat2(c, -s, s, c);
}

float getEaseCubic(float t) {
    return t * t;
}

// PQ 转线性亮度（单位：尼特）
float pqToLinear(float pq) {
    pq = clamp(pq, 0.0, 1.0);
    const float m1 = 0.1593017578125;
    const float m2 = 78.84375;
    const float c1 = 0.8359375;
    const float c2 = 18.8515625;
    const float c3 = 18.6875;

    float V = pow(pq, 1.0 / m2);
    float L = pow(max(V - c1, 1e-6) / max(c2 - c3 * V, 1e-6), 1.0 / m1);
    return L * 10000.0;
}

// 线性亮度转 PQ
float linearToPq(float linear) {
    linear = clamp(linear / 10000.0, 0.0, 1.0);
    const float m1 = 0.1593017578125;
    const float m2 = 78.84375;
    const float c1 = 0.8359375;
    const float c2 = 18.8515625;
    const float c3 = 18.6875;

    float L = pow(linear, m1);
    float V = (c1 + c2 * L) / (1.0 + c3 * L);
    return pow(V, m2);
}

vec3 processBrightness(vec3 inColor, float brightness) {
    vec3 pqColor = clamp(inColor.rgb, 0.0, 1.0);

    vec3 linearColor = vec3(
        pqToLinear(pqColor.r),
        pqToLinear(pqColor.g),
        pqToLinear(pqColor.b)
    );
    float scale = 800.0 / 8000.0 ;
    vec3 adjustedColor = linearColor * scale * brightness;
    vec3 color = vec3(
        linearToPq(adjustedColor.r),
        linearToPq(adjustedColor.g),
        linearToPq(adjustedColor.b)
    );
    return color;
}

void main() {
    float frameIndex = time / 1000.0;
    vec2 uv = vTexCoord;
    vec2 uvPixcel = uv * iResolution;
    float ratio = iResolution.x /iResolution.y;
    vec2 center = iResolution.xy / 2.0;
    vec2 hsize = iResolution.xy / 2.0;

    float t = frameIndex;
    float amplitude = 0.0;

    float blurRadius = uBlurRadius;

    float fade = 1.0;

    blurRadius = 50.02 * blurRadiusFactor;
    if(blurRadius <= 0.0){
        fragColor = vec4(0.0);
        return;
    }

    vec2 a = uv * iResolution.xy;
    vec2 b = iResolution.xy;
    //float cosTheta = dot(a, b) / (length(a) * length(b));
    //cosTheta = clamp(cosTheta, -1.0, 1.0);
    //float angle = acos(cosTheta);
    vec2 v = (a * 2.0 - b) /vec2(sqrt(iResolution.x / iResolution.y), 1.0);
    float angle = atan(v.y, v.x);
    float r = length(v);

    //调整振幅
    float wave1 = sin(angle * 4.0 + speed * 0.8 * PI);
    if(wave1 < 0.0) wave1 *= 0.5;
    float wave2= sin((angle * 3.0 + PI / 16.0) * 2.0 - speed * 0.8 * PI);
    if(wave2 < 0.0) wave2 *= 0.5;
    //blurRadius = ((outAmplitude * (wave1 + wave2)* blurRadius * 0.3) + 0.8 * blurRadius)  * (0.8*abs(sin(breathingRate * 2.0 * PI)) + 1.0);;

    float distShadow = clamp(sigmoid(sdRoundRect(uvPixcel - center + vec2(0.0, 0.0),
    hsize, cornerRadius + blurRadius) / blurRadius), 0.0, 1.0);

    float distRect = clamp(sdRoundRect(uvPixcel - center, hsize, cornerRadius), 0.0, 1.0);

    vec3 col = vec3(distShadow);
    vec3 edge = mix(vec3(1.0), vec3(0.0), distRect);
    vec3 gradient = mix(vec3(1.0), col, distRect);

    //调整旋转速度
    uv.y = 1.0 - uv.y;
    vec2 uv1 = uv - 0.5;
    uv1.y *= 1.0/(iResolution.x/iResolution.y);
    uv1 *= rotate2d(-t *45.0 + 30.0 /*+ 180.0*/);
    uv1.y *= (iResolution.x/iResolution.y);
    uv1+=0.5;

    float noise = hash12(uv);
    vec3 gradientColor = culColor(uv1).rgb;//调整饱和度
    gradientColor = convert709To2020(gradientColor);
    gradientColor = processBrightness(gradientColor, uBrightness);
    vec4 edgeColor = vec4(gradientColor * edge.x + vec3(noise)/255.0, 1.0);
    fragColor = vec4(gradientColor*gradient.x * edge.x + vec3(noise)/255.0, 1.0);
    float change = clamp(1.0 - (clamp(frameIndex * 2.5, 0.0, 5.0) / 4.0), 0.0, 1.0);
    change = 1.0 - getEaseCubic(1.0 - change);

    //vec4 back = texture(inputImageTexture, vec2(uv2.x, 1.0 - uv2.y));
    //fragColor = vec4(vec3(getMask(uv)), 1.0);
   float mask = getMask(uv);
   col.x *= clamp(blurRadiusFactor * 1.0, 0.0, 1.0);
   float factor = 5.0;
   //float alpha = clamp(mask *change + mask*col.x * 4.0 - mask*mask *change*col.x* factor, 0.0, 1.0);
   float alpha = clamp(mask * change * clamp(1.0 - mask * col.x * factor, 0.0, 1.0) + mask * col.x * 4.5, 0.0, 1.0);
   vec3 src = clamp(fragColor.rgb * mask * change * clamp(1.0 - mask * col.x * factor, 0.0, 1.0) + edgeColor.rgb * mask * col.x * factor, 0.0, 1.0);
   fragColor = vec4(src * showAlpha * fade * 0.8, alpha * showAlpha * fade * 0.8);
}
%uniform:time&float&0.0
%uniform:iResolution&vec2&1080.0,1920.0
%uniform:inputImageTexture&sampler2D&sample/screen_s_1080x2400.png
%uniform:speed&float&1.0
%uniform:outAmplitude&float&0.0
%uniform:uBrightness&float&1.0
%uniform:positions&vec3v&0.5,0.8,0.8,0.1,0.8,1.0,0.6,0.0,0.9,0.9,0.5,0.0,1.0,0.2, 0.0
%uniform:colors&vec4v&196,134,255,255,2,196,255,255,255,171,95,255,255,85,129,255,255,85,129,255
%uniform:backColor&vec4&255,85,129,255
%uniform:blurRadiusFactor&float&1.0
%uniform:cornerRadius&float&100.0
%uniform:uBlurRadius&float&25.0
%uniform:breathingRate&float&0.0
%uniform:showAlpha&float&1.0
%uniform:startPoint&vec2&1.0,0.33
%tag:end