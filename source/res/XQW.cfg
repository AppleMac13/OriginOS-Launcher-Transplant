%tag:start
%type:RenderNode&1&0
%name:background
%position:0.0&0.0&0.0
%rotation:0.0
%scale:1.0&1.0
%width:1080.0
%height:2400.0
%vert:
#version 320 es
layout (location = 0) in vec4 aPosition;
layout (location = 1) in vec2 aTexCoord;
uniform mat4 MVP;
out vec2 vTexCoord;
void main()
{
   gl_Position = MVP * aPosition;
   vTexCoord = vec2(aTexCoord.x, 1.0 - aTexCoord.y);
}
%frag:
#version 320 es
precision mediump float;
in vec2 vTexCoord;
uniform sampler2D mainTex;
uniform float alpha;
uniform vec3 colorScale;
out vec4 fragColor;
void main()
{
  fragColor = texture(mainTex, vTexCoord);
  fragColor.rgb *= colorScale;
  fragColor.a *= alpha;
}
%uniform:mainTex&sampler2D&sample/screen_s_1080x2400.png
%uniform:alpha&float&1.0
%uniform:colorScale&vec3&1.0,1.0,1.0
%tag:end